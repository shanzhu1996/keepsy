name: Keepsy Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepsy Supabase
        env:
          SUPABASE_URL: https://kjvyvggofrzmzrwbtlen.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.KEEPSY_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/students?select=id&limit=1")
          echo "HTTP $status"
          cat /tmp/body
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
